name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # No path filter on pull requests: this check is REQUIRED on main, and a required check
  # that is skipped by a path filter would stay « pending » forever on the other side's PRs.
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Run unit tests (Vitest, headless)
        run: npx ng test --watch=false

      - name: Build for production
        run: npm run build
