services:
  postgres:
    image: postgres:16-alpine
    container_name: honeylms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: honeylms
      POSTGRES_USER: honeylms
      POSTGRES_PASSWORD: honeylms
    ports:
      - "5432:5432"
    volumes:
      - honeylms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeylms -d honeylms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NoSQL : audit log. Port published on localhost only (MongoDB Compass), never on the network.
  mongo:
    image: mongo:8.0
    container_name: honeylms-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - honeylms-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeylms-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/honeylms
      SPRING_DATASOURCE_USERNAME: honeylms
      SPRING_DATASOURCE_PASSWORD: honeylms
      STORAGE_LOCATION: /data/uploads
      SPRING_MONGODB_URI: mongodb://mongo:27017/honeylms_audit?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
      # Local environment = profile "dev" (loads the demo seed). Override with SPRING_PROFILES_ACTIVE=.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    volumes:
      - honeylms-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Production-like front: Angular build served by nginx, /api relayed to "backend".
  # Demo: http://localhost:8000   (development stays on « npm start », http://localhost:4200)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeylms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8080"
    depends_on:
      - backend

volumes:
  honeylms-postgres-data:
  honeylms-mongo-data:
  honeylms-uploads:
