name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honeylms_test
          POSTGRES_USER: honeylms
          POSTGRES_PASSWORD: honeylms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw  # ← s'exécute à la racine (plus de working-directory)

      - name: Build and run tests
        working-directory: backend  # ← uniquement cette étape dans backend/
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/honeylms_test
          SPRING_DATASOURCE_USERNAME: honeylms
          SPRING_DATASOURCE_PASSWORD: honeylms
        run: ../mvnw -B clean verify  # ← remonter d'un cran pour trouver mvnw
