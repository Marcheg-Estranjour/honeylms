spring:
  application:
    name: honeylms-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/honeylms}
    username: ${SPRING_DATASOURCE_USERNAME:honeylms}
    password: ${SPRING_DATASOURCE_PASSWORD:honeylms}

  jpa:
    hibernate:
      # Le schéma est entièrement piloté par Flyway : Hibernate ne doit jamais le modifier.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The demo seed (db/seed/R__demo_seed.sql) is a repeatable migration loaded only with
    # the "dev" profile. Without this, starting WITHOUT "dev" on a database that was seeded
    # would fail validation ("applied migration not resolved"). Only *missing repeatable*
    # migrations are tolerated: versioned migrations are still strictly validated.
    ignore-migration-patterns: "*:future,repeatable:missing"

  servlet:
    multipart:
      # Légèrement au-dessus de la limite métier (50 MiB, cf. FileStorageProperties) :
      # c'est FileStorageService, pas cette limite technique, qui doit produire le
      # message d'erreur exact pour un dépassement.
      max-file-size: 55MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # /!\ Valeur par défaut pour le développement uniquement.
    # En production : définir JWT_SECRET via une variable d'environnement (secret >= 32 caractères).
    secret: ${JWT_SECRET:please-change-this-dev-only-jwt-secret-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h, cf. Dossier de Conception §12.2
  storage:
    location: ${STORAGE_LOCATION:/data/uploads}
    max-size-bytes: ${STORAGE_MAX_SIZE_BYTES:52428800} # 50 MiB, règle métier 14
    allowed-extensions: ${STORAGE_ALLOWED_EXTENSIONS:pdf,docx,xlsx,pptx,jpg,jpeg,png,mp3,mp4}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.honeygroup.honeylms: INFO
    org.flywaydb: INFO
