name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # No path filter on pull requests: this check is REQUIRED on main, and a required check
  # that is skipped by a path filter would stay « pending » forever on the other side's PRs.
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honeylms_test
          POSTGRES_USER: honeylms
          POSTGRES_PASSWORD: honeylms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/honeylms_test
          SPRING_DATASOURCE_USERNAME: honeylms
          SPRING_DATASOURCE_PASSWORD: honeylms
        run: ./mvnw -B clean verify

      # CP11 - the coverage report is kept with each run and summarised on the run page.
      - name: Coverage summary (JaCoCo)
        if: always()
        working-directory: backend
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then echo "No JaCoCo report" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          awk -F, 'NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9 }
            END {
              printf "## Couverture des tests (JaCoCo)\n\n| Mesure | Couverture |\n|---|---|\n"
              printf "| Lignes | %.1f %% (%d / %d) |\n", 100*lc/(lc+lm), lc, lc+lm
              printf "| Branches | %.1f %% (%d / %d) |\n", 100*bc/(bc+bm), bc, bc+bm
              printf "| Instructions | %.1f %% |\n", 100*ic/(ic+im)
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
