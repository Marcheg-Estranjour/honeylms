# HoneyLMS front — static Angular app + /api relayed to the backend (same origin → no CORS).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: 50 MiB business rule (+ multipart overhead) — same limit as Spring (55MB).
    client_max_body_size 55m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API: relayed to the backend container (keeps the /api prefix) ---
    # ^~ : wins over the regex location below (an /api URL ending in .png must still reach the API)
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Large uploads/downloads streamed, not buffered to disk by nginx
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # --- Hashed build files (main-XXXX.js, styles-XXXX.css, fonts): cached for a year ---
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Angular routes (/catalog, /courses/12/lessons/3…): always index.html, never cached ---
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
