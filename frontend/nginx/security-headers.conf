# Security headers — included in EVERY location: in nginx, an add_header inside a location
# cancels all the add_header inherited from the server block.
#
# CSP (CHOIX TECHNIQUE):
#  - script-src 'self'         : no inline script, no external script (fonts are self-hosted).
#  - style-src 'unsafe-inline' : Angular injects component styles as <style> elements at runtime;
#                                removing it would require a CSP nonce (ngCspNonce) — post-MVP.
#  - img-src blob: data:       : file downloads go through a blob: URL; Material uses data: SVGs.
#  - connect-src 'self'        : the API is on the same origin (/api relayed by nginx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Strict-Transport-Security is NOT set here: it only makes sense behind HTTPS (reverse proxy / TLS
# termination of the hosting platform), and would break plain-http local demos.
